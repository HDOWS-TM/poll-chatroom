services:
  chatroom:
    build: .
    image: poll-chatroom:local
    container_name: poll-chatroom
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    volumes:
      - ./data:/app/data        # 聊天记录持久化到宿主机
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+process.env.PORT+'/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
