name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          node --version
          node --check server.js
          node --check public/app.js
          node --check test/smoke.js

      - name: 冒烟测试（启动服务 + 验证页面与 API）
        run: npm test

      - name: 服务启动验证（显式后台运行）
        run: |
          PORT=3000 node server.js > /tmp/chatroom.log 2>&1 &
          echo $! > /tmp/chatroom.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo ""
              echo "✅ 服务已在 Actions runner 上启动并通过健康检查"
              kill "$(cat /tmp/chatroom.pid)" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "❌ 服务未就绪，日志："
          cat /tmp/chatroom.log
          exit 1
